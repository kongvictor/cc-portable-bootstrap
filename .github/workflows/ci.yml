name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The whole point of this matrix is Windows: the maintainer's machine has no
    # PowerShell, so the native Windows launcher and installer paths can only be
    # exercised here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: POSIX syntax check
        if: runner.os != 'Windows'
        run: npm run check:posix
      - name: PowerShell parse check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Test
        run: npm test

  line-endings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cmd shims must be CRLF and BOM-free
        # Checked by reading bytes: grep strips the line terminator before
        # matching, so a pattern like [^\r]\n can never fire and the previous
        # check failed on files that were correctly CRLF.
        run: |
          set -euo pipefail
          python3 - "$(git ls-files '*.cmd' | tr '\n' ':')" <<'PY'
          import sys

          failed = False
          for name in filter(None, sys.argv[1].split(':')):
              data = open(name, 'rb').read()
              if data.startswith(b'\xef\xbb\xbf'):
                  print(f'::error file={name}::UTF-8 BOM would break cmd.exe parsing')
                  failed = True
              # Every LF must be part of a CRLF pair.
              if data.replace(b'\r\n', b'').find(b'\n') != -1:
                  print(f'::error file={name}::expected CRLF line endings')
                  failed = True
              if not data:
                  print(f'::error file={name}::file is empty')
                  failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: whitespace check
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: no committed topology
        run: |
          set -euo pipefail
          # Private addresses, ssh aliases and personal hosts must live in the
          # local profile, never in the repository.
          if git grep -nIE '(^|[^0-9.])(10\.[0-9]{1,3}|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)[0-9]{1,3}' \
             -- . ':!tests' ':!.github'; then
            echo "::error::private network address committed outside tests"
            exit 1
          fi
          if git grep -nIE '\b[A-Za-z0-9._-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b' \
             -- . ':!*.json' ':!.github' | grep -v 'example\.\|\.test\b'; then
            echo "::error::email-like string committed"
            exit 1
          fi
